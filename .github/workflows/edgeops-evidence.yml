name: EDGEOPS evidence file checks
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/edgeops/**
      - scripts/verify_edgeops_evidence.py
      - tests/test_edgeops_evidence.py
      - .github/workflows/edgeops-evidence.yml
  pull_request:
    paths:
      - README.md
      - docs/edgeops/**
      - scripts/verify_edgeops_evidence.py
      - tests/test_edgeops_evidence.py
      - .github/workflows/edgeops-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Verify published evidence files
        run: python scripts/verify_edgeops_evidence.py
      - name: Verify corruption and broken-link detection
        run: python -m unittest discover -s tests -p test_edgeops_evidence.py -v

